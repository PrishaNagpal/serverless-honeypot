AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless honeypot - core resources

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives honeypot alerts

Resources:
  HitsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: honeypot-hits
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: gsi1pk, AttributeType: S }
        - { AttributeName: gsi1sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: new-visitors
          KeySchema:
            - { AttributeName: gsi1pk, KeyType: HASH }
            - { AttributeName: gsi1sk, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 5
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: honeypot-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  DecoyAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: honeypot-decoy-admin-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: decoy-admin-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteHits
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt HitsTable.Arn
              - Sid: AlertOnHit
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/honeypot-decoy-admin:*'
  DecoyAdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/honeypot-decoy-admin
      RetentionInDays: 14
      
  HoneypotLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: honeypot-common
      Content: src/layer
      CompatibleRuntimes:
        - python3.12

  DecoyAdminFunction:
    Type: AWS::Lambda::Function
    DependsOn: DecoyAdminLogGroup
    Properties:
      FunctionName: honeypot-decoy-admin
      Runtime: python3.12
      Layers:
        - !Ref HoneypotLayer
      Handler: app.lambda_handler
      Role: !GetAtt DecoyAdminRole.Arn
      Code: src/decoy_admin
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          TABLE_NAME: !Ref HitsTable
          TOPIC_ARN: !Ref AlertTopic

  DecoyAdminUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref DecoyAdminFunction
      AuthType: NONE

  DecoyAdminUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DecoyAdminFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  DecoyAdminInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DecoyAdminFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  
  DecoyKeysRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: honeypot-decoy-keys-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: decoy-keys-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteHits
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt HitsTable.Arn
              - Sid: AlertOnHit
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/honeypot-decoy-keys:*'

  DecoyKeysLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/honeypot-decoy-keys
      RetentionInDays: 14

  DecoyKeysFunction:
    Type: AWS::Lambda::Function
    DependsOn: DecoyKeysLogGroup
    Properties:
      FunctionName: honeypot-decoy-keys
      Runtime: python3.12
      Layers:
        - !Ref HoneypotLayer
      Handler: app.lambda_handler
      Role: !GetAtt DecoyKeysRole.Arn
      Code: src/decoy_keys
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          TABLE_NAME: !Ref HitsTable
          TOPIC_ARN: !Ref AlertTopic

  DecoyKeysUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref DecoyKeysFunction
      AuthType: NONE

  DecoyKeysUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DecoyKeysFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  DecoyKeysInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DecoyKeysFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true
  
  DecoyApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: honeypot-decoy-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: decoy-api-permissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteHits
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt HitsTable.Arn
              - Sid: AlertOnHit
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
              - Sid: OwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/honeypot-decoy-api:*'

  DecoyApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/honeypot-decoy-api
      RetentionInDays: 14

  DecoyApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: DecoyApiLogGroup
    Properties:
      FunctionName: honeypot-decoy-api
      Runtime: python3.12
      Layers:
        - !Ref HoneypotLayer
      Handler: app.lambda_handler
      Role: !GetAtt DecoyApiRole.Arn
      Code: src/decoy_api
      MemorySize: 128
      Timeout: 3
      Environment:
        Variables:
          TABLE_NAME: !Ref HitsTable
          TOPIC_ARN: !Ref AlertTopic

  DecoyApiUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref DecoyApiFunction
      AuthType: NONE

  DecoyApiUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DecoyApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  DecoyApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DecoyApiFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  TableName:
    Value: !Ref HitsTable
  TopicArn:
    Value: !Ref AlertTopic
  AdminUrl:
    Value: !GetAtt DecoyAdminUrl.FunctionUrl
  KeysUrl:
    Value: !GetAtt DecoyKeysUrl.FunctionUrl
  ApiUrl:
    Value: !GetAtt DecoyApiUrl.FunctionUrl
    